<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GTO MIND">
    <title>🤖 GTO MIND AI - Poker Helper</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🤖</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2ecc71;
            --danger: #e74c3c;
            --warning: #f39c12;
            --info: #3498db;
            --dark: #2c3e50;
            --light: #ecf0f1;
            --safe-top: max(env(safe-area-inset-top), 12px);
            --safe-bottom: max(env(safe-area-inset-bottom), 12px);
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--dark);
            color: white;
            overflow: hidden;
        }

        body {
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 16px 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.8;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            color: #333;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #555;
            text-transform: uppercase;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.1);
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .recommendation-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }

        .action-text {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .action-text.fold { color: #ff6b6b; }
        .action-text.call { color: #ffa94d; }
        .action-text.raise { color: #51cf66; }
        .action-text.check { color: #74c0fc; }
        .action-text.bet { color: #51cf66; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            display: block;
            margin-top: 4px;
        }

        .reasoning {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.6;
            margin-top: 8px;
            border-left: 3px solid white;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:active {
            transform: scale(0.95);
            opacity: 0.8;
        }

        .btn-secondary {
            background: var(--danger);
            color: white;
        }

        .btn-secondary:active {
            transform: scale(0.95);
            opacity: 0.8;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .history {
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 6px;
            border-left: 3px solid var(--info);
        }

        .hidden { display: none; }

        @media (prefers-color-scheme: dark) {
            .card { background: rgba(30, 30, 40, 0.9); color: #eee; }
            input, select { background: rgba(50, 50, 60, 0.8); color: white; border-color: rgba(100, 100, 120, 0.5); }
            label { color: #aaa; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 GTO MIND AI</h1>
            <p>Real-Time Poker Analysis</p>
        </div>

        <div class="content">
            <!-- Input Card -->
            <div class="card">
                <div class="card-title">🎯 На руке</div>
                
                <div class="input-group">
                    <label>Ваши карты</label>
                    <input type="text" id="myCards" placeholder="AS KH" maxlength="5" value="AS KH">
                </div>

                <div class="input-group">
                    <label>Борд</label>
                    <input type="text" id="board" placeholder="QD JC 9H" value="">
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label>Банк ($)</label>
                        <input type="number" id="pot" placeholder="1000" value="1000">
                    </div>
                    <div class="input-group">
                        <label>К колл ($)</label>
                        <input type="number" id="bet" placeholder="100" value="100">
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label>Мой стек ($)</label>
                        <input type="number" id="stack" placeholder="5000" value="5000">
                    </div>
                    <div class="input-group">
                        <label>Позиция</label>
                        <select id="position">
                            <option value="utg">UTG</option>
                            <option value="mp">MP</option>
                            <option value="co">CO</option>
                            <option value="button" selected>BTN</option>
                            <option value="sb">SB</option>
                            <option value="bb">BB</option>
                        </select>
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn-primary" onclick="analyze()">📊 АНАЛИЗ</button>
                    <button class="btn-secondary" onclick="clearFields()">🔄 ОЧИСТИТЬ</button>
                </div>
            </div>

            <!-- Recommendation Card -->
            <div class="card" id="recommendationCard" style="display: none;">
                <div class="recommendation-box">
                    <div class="action-text" id="actionText">--</div>
                    <div class="stats-grid">
                        <div class="stat-item">
                            Уверенность
                            <span class="stat-value" id="confidence">--</span>
                        </div>
                        <div class="stat-item">
                            Equity
                            <span class="stat-value" id="equity">--</span>
                        </div>
                        <div class="stat-item">
                            EV
                            <span class="stat-value" id="ev">--</span>
                        </div>
                        <div class="stat-item">
                            Ставка
                            <span class="stat-value" id="betSize">--</span>
                        </div>
                    </div>
                    <div class="reasoning" id="reasoning"></div>
                </div>
            </div>

            <!-- History Card -->
            <div class="card">
                <div class="card-title">📊 Основные руки</div>
                <div class="history" id="history">
                    <div style="text-align: center; color: #999; padding: 12px; font-size: 12px;">
                        Основные руки будут появляться здесь
                    </div>
                </div>
            </div>

            <!-- Loading -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div>Анализирую...</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        let sessionId = localStorage.getItem('gtomind_session') || '';
        
        if (!sessionId) {
            // Create new session
            fetch('/api/session/create', { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    sessionId = data.session_id;
                    localStorage.setItem('gtomind_session', sessionId);
                    console.log('Session created:', sessionId);
                });
        }

        async function analyze() {
            const myCards = document.getElementById('myCards').value.split(' ');
            const board = document.getElementById('board').value.split(' ').filter(c => c);
            const pot = parseFloat(document.getElementById('pot').value) || 0;
            const bet = parseFloat(document.getElementById('bet').value) || 0;
            const stack = parseFloat(document.getElementById('stack').value) || 5000;
            const position = document.getElementById('position').value;

            if (myCards.length < 2 || !myCards[0] || !myCards[1]) {
                alert('Пожалуйста, введите две карты!');
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('recommendationCard').style.display = 'none';

            try {
                const response = await fetch('/api/quick-analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        my_cards: myCards.slice(0, 2),
                        community_cards: board,
                        pot: pot,
                        bet: bet,
                        stack: stack,
                        position: position,
                        players_count: 6
                    })
                });

                const data = await response.json();

                if (data.status === 'success') {
                    displayRecommendation(data);
                    addToHistory(data, myCards.slice(0, 2).join(' '), board.join(' '));
                } else {
                    alert('Ошибка: ' + data.message);
                }
            } catch (error) {
                alert('Ошибка: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function displayRecommendation(data) {
            const actionEl = document.getElementById('actionText');
            const action = data.action.toLowerCase();
            
            // Update action text and color
            actionEl.textContent = data.action;
            actionEl.className = 'action-text ' + action;

            // Update stats
            document.getElementById('confidence').textContent = Math.round(data.confidence * 100) + '%';
            document.getElementById('equity').textContent = data.equity.toFixed(1) + '%';
            document.getElementById('ev').textContent = '$' + data.ev.toFixed(2);
            document.getElementById('betSize').textContent = data.bet_size ? '$' + data.bet_size.toFixed(0) : '--';
            document.getElementById('reasoning').textContent = data.reasoning;

            document.getElementById('recommendationCard').style.display = 'block';
        }

        function addToHistory(data, cards, board) {
            const historyEl = document.getElementById('history');
            
            // Clear placeholder if needed
            if (historyEl.querySelector('div:only-child')) {
                historyEl.innerHTML = '';
            }

            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `
                <strong>${data.action}</strong> (${cards}${board ? ' | ' + board : ''}) - 
                ${Math.round(data.confidence * 100)}% - 
                EV: $${data.ev.toFixed(2)}
            `;
            historyEl.insertBefore(item, historyEl.firstChild);

            // Keep only last 10
            while (historyEl.children.length > 10) {
                historyEl.removeChild(historyEl.lastChild);
            }
        }

        function clearFields() {
            document.getElementById('myCards').value = 'AS KH';
            document.getElementById('board').value = '';
            document.getElementById('pot').value = '1000';
            document.getElementById('bet').value = '100';
            document.getElementById('stack').value = '5000';
            document.getElementById('position').value = 'button';
            document.getElementById('recommendationCard').style.display = 'none';
        }

        // Keyboard shortcuts
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') analyze();
        });
    </script>
</body>
</html>
